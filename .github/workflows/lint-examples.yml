name: Lint examples & manifest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck (bash examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './examples'

  python-syntax:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compile-check every example .py file
        run: |
          set -e
          find examples -name '*.py' -print0 | xargs -0 -n1 python3 -m py_compile

  node-syntax:
    name: Node.js syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check every example .js file
        run: |
          set -e
          find examples -name '*.js' -print0 | xargs -0 -n1 node --check

  manifest-xml:
    name: Validate manifest XML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: xmllint every manifest file
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          for f in manifest/*.xml; do
            echo "Checking $f"
            xmllint --noout "$f"
          done
